<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superhero - Badge Wall</title>
    <link rel="icon" type="image/svg+xml" href="/wall-favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, hsl(0 0% 98%), hsl(221 20% 98%));
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Sparkles / stars animation */
        .snowflakes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .snowflake {
            position: absolute;
            color: hsl(221 83% 53% / 0.25);
            font-size: 1.5em;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        /* Header */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: hsl(221 83% 53%);
            color: white;
            padding: 1.5rem;
            text-align: center;
            z-index: 10;
            border-bottom: 4px solid hsl(221 83% 18%);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        .draw-button {
            background: hsl(221 83% 18%);
            color: white;
            border: 4px solid white;
            padding: 0.75rem 2rem;
            font-size: 1.25rem;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 4px 4px 0px white;
        }

        .draw-button:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px white;
        }

        .draw-button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px white;
        }

        .draw-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .view-toggle-button {
            background: hsl(217 91% 60%);
            color: white;
            border: 4px solid white;
            padding: 0.75rem 2rem;
            font-size: 1.25rem;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 4px 4px 0px white;
        }

        .view-toggle-button:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px white;
        }

        .view-toggle-button.active {
            background: hsl(0 84% 50%);
        }

        /* Badge wall container */
        .wall-container {
            position: absolute;
            top: 100px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            padding: 1rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        /* Video container specific styles */
        .wall-container #video-container {
            padding: 0.75rem;
        }

        .badge-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            height: 100%;
            max-width: 100%;
            justify-content: center;
            align-items: center;
        }

        .badge-row {
            display: flex;
            flex-direction: row;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        .badge-card {
            background: white;
            border: 4px solid hsl(142 76% 20%);
            border-radius: 1.25rem;
            padding: 0.875rem;
            box-shadow: 6px 6px 0px hsl(142 76% 20%), 0 0 15px rgba(0, 0, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 280px;
            min-width: 280px;
            max-width: 280px;
            height: 360px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        @media (min-width: 2560px) {
            .badge-card {
                width: 320px;
                min-width: 320px;
                max-width: 320px;
                height: 400px;
            }
        }

        @media (max-width: 1920px) {
            .badge-card {
                width: 280px;
                min-width: 280px;
                max-width: 280px;
                height: 360px;
            }
        }

        @media (max-width: 1440px) {
            .badge-card {
                width: 240px;
                min-width: 240px;
                max-width: 240px;
                height: 320px;
            }
        }

        @media (max-width: 1024px) {
            .badge-card {
                width: 200px;
                min-width: 200px;
                max-width: 200px;
                height: 280px;
            }
        }

        .badge-card:nth-child(odd) {
            animation-delay: 0s;
            transform: rotate(-2deg);
            border-color: hsl(142 76% 20%);
            box-shadow: 8px 8px 0px hsl(142 76% 20%), 0 0 20px rgba(34, 197, 94, 0.2);
        }

        .badge-card:nth-child(even) {
            animation-delay: 1.5s;
            transform: rotate(2deg);
            border-color: hsl(0 84% 50%);
            box-shadow: 8px 8px 0px hsl(0 84% 50%), 0 0 20px rgba(239, 68, 68, 0.2);
        }

        .badge-card:nth-child(3n) {
            transform: rotate(1deg);
            animation-delay: 0.75s;
            border-color: hsl(217 91% 60%);
            box-shadow: 8px 8px 0px hsl(217 91% 60%), 0 0 20px rgba(59, 130, 246, 0.2);
        }

        .badge-card:nth-child(4n) {
            transform: rotate(-1.5deg);
            animation-delay: 2.25s;
            border-color: hsl(45 93% 58%);
            box-shadow: 8px 8px 0px hsl(45 93% 58%), 0 0 20px rgba(234, 179, 8, 0.2);
        }

        .badge-card:nth-child(5n) {
            border-color: hsl(280 67% 60%);
            box-shadow: 8px 8px 0px hsl(280 67% 60%), 0 0 20px rgba(168, 85, 247, 0.2);
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(var(--rotation, 0deg));
            }
            50% {
                transform: translateY(-15px) rotate(var(--rotation, 0deg));
            }
        }

        .badge-card:hover {
            transform: scale(1.08) rotate(0deg) !important;
            box-shadow: 12px 12px 0px currentColor, 0 0 40px rgba(0, 0, 0, 0.3);
            z-index: 10;
            filter: brightness(1.05);
        }

        .badge-image-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, hsl(142 20% 95%), hsl(142 30% 98%));
            border-radius: 1rem;
            overflow: hidden;
            margin-bottom: 1rem;
            padding: 0.5rem;
        }

        .badge-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15));
        }

        .badge-info {
            text-align: center;
        }

        .badge-name {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 0.375rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .badge-card:nth-child(odd) .badge-name {
            color: hsl(142 76% 20%);
        }

        .badge-card:nth-child(even) .badge-name {
            color: hsl(0 84% 50%);
        }

        .badge-card:nth-child(3n) .badge-name {
            color: hsl(217 91% 60%);
        }

        .badge-card:nth-child(4n) .badge-name {
            color: hsl(45 93% 58%);
        }

        .badge-card:nth-child(5n) .badge-name {
            color: hsl(280 67% 60%);
        }

        .badge-category {
            font-size: 1rem;
            color: hsl(142 30% 40%);
            text-transform: capitalize;
            font-weight: 600;
        }

        .badge-number {
            font-size: 1.25rem;
            color: hsl(0 84% 50%);
            font-weight: 900;
            margin-top: 0.5rem;
            margin-bottom: 0.25rem;
            text-transform: none;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        /* Empty state */
        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: hsl(142 30% 40%);
        }

        .empty-state h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        /* Loading state */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: hsl(142 30% 40%);
        }

        .spinner {
            border: 4px solid hsl(142 20% 95%);
            border-top: 4px solid hsl(0 84% 50%);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Podium styles */
        .podium-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s ease;
        }

        .podium-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .podium-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3rem;
            max-width: 90vw;
            padding: 2rem;
        }

        .podium-winner {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(150px) scale(0.8);
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .podium-winner.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            animation: slideUp 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes slideUp {
            0% {
                transform: translateY(150px) scale(0.8);
                opacity: 0;
            }
            60% {
                transform: translateY(-10px) scale(1.02);
                opacity: 1;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .podium-badge-card {
            background: white;
            border: 6px solid;
            border-radius: 1.5rem;
            padding: 1.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 1rem;
            position: relative;
        }

        /* 2nd place - left - medium size */
        .podium-winner:nth-child(1) .podium-badge-card {
            border-color: #C0C0C0;
            width: 260px;
            height: 340px;
            box-shadow: 0 12px 40px rgba(192, 192, 192, 0.5);
        }

        /* 1st place - center - largest size */
        .podium-winner:nth-child(2) .podium-badge-card {
            border-color: #FFD700;
            width: 320px;
            height: 400px;
            box-shadow: 0 20px 60px rgba(255, 215, 0, 0.6);
        }

        /* 3rd place - right - smallest size */
        .podium-winner:nth-child(3) .podium-badge-card {
            border-color: #CD7F32;
            width: 220px;
            height: 300px;
            box-shadow: 0 10px 35px rgba(205, 127, 50, 0.4);
        }

        .podium-badge-image {
            width: 100%;
            height: 70%;
            object-fit: contain;
            margin-bottom: 1rem;
        }

        .podium-badge-info {
            text-align: center;
        }

        .podium-badge-name {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
        }

        /* 2nd place - silver */
        .podium-winner:nth-child(1) .podium-badge-name {
            color: #C0C0C0;
        }

        /* 1st place - gold */
        .podium-winner:nth-child(2) .podium-badge-name {
            color: #FFD700;
        }

        /* 3rd place - bronze */
        .podium-winner:nth-child(3) .podium-badge-name {
            color: #CD7F32;
        }

        .podium-rank {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* 2nd place - silver */
        .podium-winner:nth-child(1) .podium-rank {
            color: #C0C0C0;
        }

        /* 1st place - gold */
        .podium-winner:nth-child(2) .podium-rank {
            color: #FFD700;
        }

        /* 3rd place - bronze */
        .podium-winner:nth-child(3) .podium-rank {
            color: #CD7F32;
        }

        .podium-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: white;
            border: 4px solid hsl(0 84% 50%);
            color: hsl(0 84% 50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 2rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 4px 4px 0px hsl(0 84% 50%);
        }

        .podium-close:hover {
            transform: scale(1.1);
            box-shadow: 6px 6px 0px hsl(0 84% 50%);
        }

        .podium-title {
            position: absolute;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 4rem;
            font-weight: 900;
            color: white;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        /* Video view styles */
        .video-container {
            display: none;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 2rem;
        }

        .video-container.show {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 0.75rem;
            justify-items: center;
            align-items: start;
            max-width: 100%;
            padding: 0.75rem;
            height: calc(100vh - 100px - 1.5rem);
            overflow-y: auto;
        }

        .video-item {
            background: white;
            border: 3px solid hsl(142 76% 20%);
            border-radius: 0.75rem;
            padding: 0;
            box-shadow: 4px 4px 0px hsl(142 76% 20%);
            width: 100%;
            height: 100%;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .video-item:hover {
            transform: scale(1.05);
            box-shadow: 10px 10px 0px hsl(142 76% 20%);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 0;
            background: #000;
            border-radius: 0.75rem 0.75rem 0 0;
            overflow: hidden;
        }

        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-name {
            padding: 0.5rem 0.75rem;
            text-align: center;
            font-size: 0.875rem;
            font-weight: 800;
            color: hsl(142 76% 20%);
            border-top: 2px solid hsl(142 76% 20%);
            line-height: 1.2;
        }

        .video-item {
            cursor: pointer;
        }

        /* Video Modal Styles */
        .video-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .video-modal-content {
            position: relative;
            width: 90%;
            max-width: 1200px;
            background: white;
            border: 4px solid hsl(0 84% 50%);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 8px 8px 0px hsl(0 84% 50%);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .video-modal-close {
            position: absolute;
            top: -20px;
            right: -20px;
            background: hsl(0 84% 50%);
            border: 4px solid white;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 2rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 4px 4px 0px white;
            z-index: 1001;
        }

        .video-modal-close:hover {
            transform: scale(1.1);
            box-shadow: 6px 6px 0px white;
        }

        .video-modal-name {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 900;
            color: hsl(142 76% 20%);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .video-modal-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            background: #000;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .video-modal-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Snowflakes -->
    <div class="snowflakes" id="snowflakes"></div>

    <!-- Header -->
    <div class="header">
        <h1>🦸 Superhero Comics Mate Badge Wall 🦸</h1>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <button class="view-toggle-button" id="view-toggle-button" data-view="cards">📸 Cards View</button>
            <button class="draw-button" id="draw-button">🎲 Start Draw</button>
        </div>
    </div>

    <!-- Wall Container -->
    <div class="wall-container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading badges...</p>
        </div>
        <div id="empty-state" class="empty-state" style="display: none;">
            <h2>🎁 No badges yet!</h2>
            <p>Badges will appear here as they are created...</p>
        </div>
        <div id="badge-container" style="display: none;"></div>
        <div id="video-container" class="video-container"></div>
    </div>

    <!-- Podium Overlay -->
    <div class="podium-overlay" id="podium-overlay">
        <div class="podium-title">🏆 Winners 🏆</div>
        <div class="podium-close" id="podium-close">×</div>
        <div class="podium-container" id="podium-container"></div>
    </div>

    <!-- Video Preview Modal -->
    <div class="video-modal-overlay" id="video-modal-overlay" style="display: none;">
        <div class="video-modal-content">
            <div class="video-modal-close" id="video-modal-close">×</div>
            <div class="video-modal-name" id="video-modal-name"></div>
            <div class="video-modal-wrapper">
                <video id="video-modal-player" controls autoplay playsinline></video>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/get-badges';
        const VIDEOS_API_URL = 'https://comwrap25.app.n8n.cloud/webhook/get-videos';
        let currentBadges = [];
        let allBadges = [];
        let allVideos = []; // Array of {url: string, nome: string}
        let currentView = 'cards'; // 'cards' or 'videos'
        let refreshInterval = null;
        let rotationInterval = null;
        let currentRotationIndex = 0;
        let isVideoViewActive = false; // Flag to completely block badge operations
        let videoRotationInterval = null; // For rotating videos
        const ROTATION_INTERVAL = 8000; // Change badges every 8 seconds
        const VIDEO_ROTATION_INTERVAL = 10000; // Change videos every 10 seconds

        // Create sparkles
        function createSnowflakes() {
            const snowflakesContainer = document.getElementById('snowflakes');
            const snowflakeCount = 30;
            const sparkleEmojis = ['⚡', '⭐', '🛡️'];
            for (let i = 0; i < snowflakeCount; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.innerHTML = sparkleEmojis[i % sparkleEmojis.length];
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.animationDuration = (Math.random() * 3 + 2) + 's';
                snowflake.style.animationDelay = Math.random() * 2 + 's';
                snowflake.style.opacity = Math.random() * 0.5 + 0.3;
                snowflakesContainer.appendChild(snowflake);
            }
        }

        // Fetch badges from API
        async function fetchBadges() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error('Failed to fetch badges');
                }
                const badges = await response.json();
                return badges;
            } catch (error) {
                console.error('Error fetching badges:', error);
                return [];
            }
        }

        // Calculate card dimensions based on screen size
        function getCardDimensions() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            // Base dimensions
            let cardWidth = 280;
            let cardHeight = 360;
            
            if (width <= 1024) {
                cardWidth = 200;
                cardHeight = 280;
            } else if (width <= 1440) {
                cardWidth = 240;
                cardHeight = 320;
            } else if (width <= 1920) {
                cardWidth = 280;
                cardHeight = 360;
            } else if (width >= 2560) {
                cardWidth = 320;
                cardHeight = 400;
            }
            
            // Adjust based on available height (header is ~100px, padding ~32px, gap between rows ~16px)
            const availableHeight = height - 100 - 32 - 16; // header + padding + gap
            const maxCardHeight = availableHeight / 2; // Two rows
            
            if (cardHeight > maxCardHeight) {
                const scale = maxCardHeight / cardHeight;
                cardHeight = maxCardHeight;
                cardWidth = cardWidth * scale;
            }
            
            return { width: cardWidth, height: cardHeight };
        }

        // Calculate how many cards fit in one row
        function calculateCardsPerRow() {
            const dimensions = getCardDimensions();
            const cardWidth = dimensions.width;
            const gap = 16; // Gap between cards (1rem = 16px)
            const padding = 48; // Total horizontal padding (1.5rem * 2 = 48px)
            const availableWidth = window.innerWidth - padding;
            const cardsPerRow = Math.floor(availableWidth / (cardWidth + gap));
            return Math.max(1, cardsPerRow); // At least 1 card
        }

        // Get a random subset of badges to display
        function getRandomBadgeSubset(badges, count) {
            if (badges.length <= count) {
                // If we have fewer badges than can fit, just shuffle and return all
                return [...badges].sort(() => Math.random() - 0.5);
            }
            
            // Shuffle all badges and select a random subset
            const shuffled = [...badges].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, count);
        }

        // Render badges (can accept specific badges to show, or use allBadges)
        function renderBadges(badgesToRender = null) {
            // Don't render badges if we're in video view - strict check
            if (currentView !== 'cards' || isVideoViewActive) {
                return;
            }

            const container = document.getElementById('badge-container');
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('empty-state');
            
            // Additional safety check - ensure video container is not visible
            const videoContainer = document.getElementById('video-container');
            if (videoContainer && videoContainer.classList.contains('show')) {
                return;
            }

            // Use provided badges or fall back to allBadges
            const badges = badgesToRender || allBadges;

            if (badges.length === 0) {
                loading.style.display = 'none';
                container.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            // Final safety check before rendering
            if (currentView === 'videos' || isVideoViewActive) {
                return;
            }
            
            loading.style.display = 'none';
            emptyState.style.display = 'none';
            container.style.display = 'flex';

            // Calculate how many cards can fit
            const cardsPerRow = calculateCardsPerRow();
            const maxCards = cardsPerRow * 2; // Maximum 2 rows

            // Get random subset of badges to display
            const badgesToShow = getRandomBadgeSubset(badges, maxCards);

            // Create grid container
            const grid = document.createElement('div');
            grid.className = 'badge-grid';
            grid.id = 'badge-grid';

            // Create two rows
            const row1 = document.createElement('div');
            row1.className = 'badge-row';
            const row2 = document.createElement('div');
            row2.className = 'badge-row';

            // Get calculated card dimensions
            const cardDimensions = getCardDimensions();
            
            // Distribute badges evenly into rows
            const totalCards = badgesToShow.length;
            const cardsInRow1 = Math.ceil(totalCards / 2);
            const cardsInRow2 = totalCards - cardsInRow1;
            
            badgesToShow.forEach((badge, index) => {
                const card = document.createElement('div');
                card.className = 'badge-card';
                
                // Apply calculated dimensions
                card.style.width = cardDimensions.width + 'px';
                card.style.minWidth = cardDimensions.width + 'px';
                card.style.maxWidth = cardDimensions.width + 'px';
                card.style.height = cardDimensions.height + 'px';
                
                // Add random rotation for playful effect
                const rotation = (Math.random() - 0.5) * 4; // -2 to +2 degrees
                card.style.setProperty('--rotation', `${rotation}deg`);
                
                card.innerHTML = `
                    <div class="badge-image-container">
                        <img src="${badge.imageUrl}" alt="${badge.name}" class="badge-image" onerror="this.style.display='none'">
                    </div>
                    <div class="badge-info">
                        <div class="badge-name">${escapeHtml(badge.name)}</div>
                        ${badge.number ? `<div class="badge-number">#${escapeHtml(badge.number)}</div>` : ''}
                        <div class="badge-category">${escapeHtml(badge.category)}</div>
                    </div>
                `;
                
                // Distribute evenly: first half in row1, second half in row2
                if (index < cardsInRow1) {
                    row1.appendChild(card);
                } else {
                    row2.appendChild(card);
                }
            });

            // Add rows to grid
            if (row1.children.length > 0) {
                grid.appendChild(row1);
            }
            if (row2.children.length > 0) {
                grid.appendChild(row2);
            }

            container.innerHTML = '';
            container.appendChild(grid);
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Rotate badges to show different ones
        function rotateBadges() {
            // Don't rotate if we're in video view
            if (currentView === 'videos' || isVideoViewActive) {
                return;
            }

            if (allBadges.length === 0) return;
            
            // Calculate how many cards can fit
            const cardsPerRow = calculateCardsPerRow();
            const maxCards = cardsPerRow * 2;
            
            // If we have more badges than can fit, rotate them
            if (allBadges.length > maxCards) {
                // Get a new random subset
                const badgesToShow = getRandomBadgeSubset(allBadges, maxCards);
                renderBadges(badgesToShow);
            } else {
                // If all badges fit, just re-shuffle them for variety
                const shuffled = [...allBadges].sort(() => Math.random() - 0.5);
                renderBadges(shuffled);
            }
        }

        // Update badges from API
        async function updateBadges() {
            // Don't update badges if we're in video view - check at the very start
            if (currentView === 'videos' || isVideoViewActive) {
                return;
            }

            const badges = await fetchBadges();
            
            // Double check after async operation - view might have changed during fetch
            if (currentView === 'videos' || isVideoViewActive) {
                return;
            }
            
            // Check if badges list has changed
            const badgesChanged = JSON.stringify(badges) !== JSON.stringify(allBadges);
            
            if (badgesChanged) {
                allBadges = badges;
                // Reset rotation when badges change
                currentRotationIndex = 0;
                
                // Stop existing rotation
                if (rotationInterval) {
                    clearInterval(rotationInterval);
                }
                
                // Start rotation if we have more badges than can fit
                const cardsPerRow = calculateCardsPerRow();
                const maxCards = cardsPerRow * 2;
                
                if (allBadges.length > maxCards) {
                    // Start rotation to show all badges
                    rotationInterval = setInterval(rotateBadges, ROTATION_INTERVAL);
                }
            }
            
            // Render current badges only if in cards view
            if (currentView === 'cards' && !isVideoViewActive) {
                rotateBadges();
            }
        }

        // Debounce function for resize
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Handle window resize
        const handleResize = debounce(() => {
            // Don't handle resize if we're in video view
            if (currentView === 'videos' || isVideoViewActive) {
                return;
            }
            
            if (allBadges.length > 0) {
                // Recalculate and restart rotation if needed
                const cardsPerRow = calculateCardsPerRow();
                const maxCards = cardsPerRow * 2;
                
                // Stop existing rotation
                if (rotationInterval) {
                    clearInterval(rotationInterval);
                }
                
                // Restart rotation if we have more badges than can fit
                if (allBadges.length > maxCards) {
                    rotationInterval = setInterval(rotateBadges, ROTATION_INTERVAL);
                }
                
                // Re-render with current badges
                rotateBadges();
            }
        }, 250);

        // Initialize
        async function init() {
            createSnowflakes();
            await updateBadges();
            
            // Auto-refresh every 5 seconds to check for new badges
            refreshInterval = setInterval(updateBadges, 5000);
            
            // Listen for window resize
            window.addEventListener('resize', handleResize);
        }

        // Start when page loads
        window.addEventListener('load', init);

        // Draw functionality
        const DRAW_API_URL = 'https://comwrap25.app.n8n.cloud/webhook/get-draw';
        const BADGES_BY_EMAIL_API = 'http://localhost:5000/get-badges-by-emails';

        async function performDraw() {
            const drawButton = document.getElementById('draw-button');
            const podiumOverlay = document.getElementById('podium-overlay');
            const podiumContainer = document.getElementById('podium-container');
            
            // Disable button
            drawButton.disabled = true;
            drawButton.textContent = '🎲 Drawing...';
            
            try {
                // Call n8n API to get winners
                const response = await fetch(DRAW_API_URL, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const drawData = await response.json();
                
                // Extract winners from the response
                // The response is an array with one object containing a "data" array
                let winners = [];
                if (Array.isArray(drawData) && drawData.length > 0 && drawData[0].data) {
                    winners = drawData[0].data;
                } else if (Array.isArray(drawData)) {
                    winners = drawData;
                } else if (drawData.data) {
                    winners = drawData.data;
                }
                
                if (winners.length !== 3) {
                    throw new Error(`Expected 3 winners, got ${winners.length}`);
                }
                
                // Extract emails from winners
                const emails = winners.map(winner => winner.Email || winner.email).filter(Boolean);
                
                if (emails.length !== 3) {
                    throw new Error('Could not extract 3 valid emails from winners');
                }
                
                // Fetch badges by emails
                const badgesResponse = await fetch(BADGES_BY_EMAIL_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ emails: emails })
                });
                
                if (!badgesResponse.ok) {
                    throw new Error(`Failed to fetch badges: ${badgesResponse.status}`);
                }
                
                const badges = await badgesResponse.json();
                
                // Create a map of email to badge
                const badgeMap = new Map();
                badges.forEach(badge => {
                    if (badge.email) {
                        badgeMap.set(badge.email.toLowerCase(), badge);
                    }
                });
                
                // Match winners with badges
                const winnersWithBadges = winners.map(winner => {
                    const email = (winner.Email || winner.email || '').toLowerCase();
                    const badge = badgeMap.get(email);
                    return {
                        winner: winner,
                        badge: badge || null
                    };
                });
                
                // Show podium
                showPodium(winnersWithBadges);
                
            } catch (error) {
                console.error('Error performing draw:', error);
                alert('Error performing draw: ' + error.message);
            } finally {
                // Re-enable button
                drawButton.disabled = false;
                drawButton.textContent = '🎲 Start Draw';
            }
        }

        function showPodium(winnersWithBadges) {
            const podiumOverlay = document.getElementById('podium-overlay');
            const podiumContainer = document.getElementById('podium-container');
            
            // Clear previous content
            podiumContainer.innerHTML = '';
            
            // Order: 2nd place (left), 1st place (center), 3rd place (right)
            const orderedWinners = [
                { ...winnersWithBadges[1], rank: 2, medal: '🥈' },
                { ...winnersWithBadges[0], rank: 1, medal: '🥇' },
                { ...winnersWithBadges[2], rank: 3, medal: '🥉' }
            ];
            
            orderedWinners.forEach((item, index) => {
                const winnerDiv = document.createElement('div');
                winnerDiv.className = 'podium-winner';
                
                const winner = item.winner;
                const badge = item.badge;
                const rank = item.rank;
                const medal = item.medal;
                
                // If badge is not found, show placeholder
                if (!badge) {
                    winnerDiv.innerHTML = `
                        <div class="podium-rank">${medal}</div>
                        <div class="podium-badge-card">
                            <div class="badge-image-container" style="height: 70%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, hsl(142 20% 95%), hsl(142 30% 98%));">
                                <div style="font-size: 4rem; opacity: 0.3;">🎁</div>
                            </div>
                            <div class="podium-badge-info">
                                <div class="podium-badge-name">${escapeHtml(winner.Nome || winner.nome || 'Unknown')}</div>
                                <div style="color: hsl(142 30% 40%); font-size: 0.9rem;">Badge not found</div>
                            </div>
                        </div>
                    `;
                } else {
                    winnerDiv.innerHTML = `
                        <div class="podium-rank">${medal}</div>
                        <div class="podium-badge-card">
                            <img src="${badge.imageUrl}" alt="${badge.name}" class="podium-badge-image" onerror="this.style.display='none'">
                            <div class="podium-badge-info">
                                <div class="podium-badge-name">${escapeHtml(badge.name)}</div>
                                <div style="color: hsl(142 30% 40%); font-size: 0.9rem; text-transform: capitalize;">${escapeHtml(badge.category)}</div>
                            </div>
                        </div>
                    `;
                }
                
                podiumContainer.appendChild(winnerDiv);
                
                // Trigger animation with staggered timing
                // 3rd place: 0ms, 2nd place: 5000ms, 1st place: 10000ms
                let delay = 0;
                if (rank === 3) {
                    delay = 0; // 3rd place arrives first
                } else if (rank === 2) {
                    delay = 5000; // 2nd place after 5 seconds
                } else if (rank === 1) {
                    delay = 10000; // 1st place after 10 seconds
                }
                
                setTimeout(() => {
                    winnerDiv.classList.add('show');
                }, delay);
            });
            
            // Show overlay
            podiumOverlay.classList.add('show');
        }

        // Close podium
        document.getElementById('podium-close').addEventListener('click', () => {
            document.getElementById('podium-overlay').classList.remove('show');
        });

        // Click outside to close
        document.getElementById('podium-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'podium-overlay') {
                document.getElementById('podium-overlay').classList.remove('show');
            }
        });

        // View toggle functionality
        const viewToggleButton = document.getElementById('view-toggle-button');
        const badgeContainer = document.getElementById('badge-container');
        const videoContainer = document.getElementById('video-container');
        
        viewToggleButton.addEventListener('click', () => {
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('empty-state');
            
            if (currentView === 'cards') {
                // Switch to videos view - set flags FIRST to prevent any badge updates
                isVideoViewActive = true;
                currentView = 'videos';
                
                // Stop badge-related intervals IMMEDIATELY and clear them
                if (refreshInterval) {
                    clearInterval(refreshInterval);
                    refreshInterval = null;
                }
                if (rotationInterval) {
                    clearInterval(rotationInterval);
                    rotationInterval = null;
                }
                // Video rotation will be started in loadVideos if needed
                
                // Update UI
                viewToggleButton.textContent = '📸 Cards View';
                viewToggleButton.classList.add('active');
                
                // Hide badge-related elements
                if (loading) loading.style.display = 'none';
                if (emptyState) emptyState.style.display = 'none';
                if (badgeContainer) badgeContainer.style.display = 'none';
                
                // Show video container
                videoContainer.classList.add('show');
                
                // Load videos
                loadVideos();
            } else {
                // Switch to cards view - clear video flag FIRST
                isVideoViewActive = false;
                currentView = 'cards';
                
                // Hide video container
                videoContainer.classList.remove('show');
                
                // Stop video rotation
                if (videoRotationInterval) {
                    clearInterval(videoRotationInterval);
                    videoRotationInterval = null;
                }
                
                // Update UI
                viewToggleButton.textContent = '🎥 Videos View';
                viewToggleButton.classList.remove('active');
                
                // Restart badge-related intervals
                if (!refreshInterval) {
                    refreshInterval = setInterval(updateBadges, 5000);
                }
                
                // Restart rotation if needed
                const cardsPerRow = calculateCardsPerRow();
                const maxCards = cardsPerRow * 2;
                if (allBadges.length > maxCards && !rotationInterval) {
                    rotationInterval = setInterval(rotateBadges, ROTATION_INTERVAL);
                }
                
                // Show badge container
                if (allBadges.length > 0) {
                    badgeContainer.style.display = 'flex';
                } else {
                    emptyState.style.display = 'block';
                }
                
                // Re-render badges
                rotateBadges();
            }
        });

        // Load videos from API
        async function loadVideos() {
            try {
                const response = await fetch(VIDEOS_API_URL, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // Parse the response structure
                // Expected: [{ video_link: [{ Video: "url", Nome: "name" }, ...] }]
                let videos = [];
                
                if (Array.isArray(data) && data.length > 0) {
                    const firstItem = data[0];
                    if (firstItem.video_link && Array.isArray(firstItem.video_link)) {
                        videos = firstItem.video_link
                            .map(item => ({
                                url: item.Video || '',
                                nome: item.Nome || 'Unknown'
                            }))
                            .filter(video => video.url && video.url.trim() !== '');
                    }
                }

                allVideos = videos;
                
                // Show random subset of 9 videos
                const videosToShow = getRandomVideoSubset(videos);
                renderVideos(videosToShow);
                
                // Start rotation if we have more than 9 videos
                if (videos.length > 9) {
                    if (videoRotationInterval) {
                        clearInterval(videoRotationInterval);
                    }
                    videoRotationInterval = setInterval(() => {
                        if (currentView === 'videos' && isVideoViewActive) {
                            const newVideosToShow = getRandomVideoSubset(allVideos);
                            renderVideos(newVideosToShow);
                        }
                    }, VIDEO_ROTATION_INTERVAL);
                }
            } catch (error) {
                console.error('Error loading videos:', error);
                videoContainer.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; color: hsl(142 30% 40%);">
                        <h2>❌ Error loading videos</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Get a random subset of videos to display (always 9 videos max)
        function getRandomVideoSubset(videos) {
            const MAX_VIDEOS = 9; // Always show maximum 9 videos (3x3 grid)
            
            if (videos.length <= MAX_VIDEOS) {
                // If we have fewer videos than max, just shuffle and return all
                return [...videos].sort(() => Math.random() - 0.5);
            }
            
            // Shuffle all videos and select a random subset of 9
            const shuffled = [...videos].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, MAX_VIDEOS);
        }

        // Render videos in grid
        function renderVideos(videos) {
            // Ensure we're still in video view before rendering
            if (currentView !== 'videos' || !isVideoViewActive) {
                return;
            }

            // Ensure video container is visible and badge container is hidden
            const badgeContainer = document.getElementById('badge-container');
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('empty-state');
            
            // Force hide all badge-related elements
            if (loading) loading.style.display = 'none';
            if (emptyState) emptyState.style.display = 'none';
            if (badgeContainer) badgeContainer.style.display = 'none';
            
            // Ensure video container is visible
            videoContainer.classList.add('show');

            if (!videos || videos.length === 0) {
                videoContainer.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; color: hsl(142 30% 40%); padding: 4rem;">
                        <h2 style="font-size: 2rem; margin-bottom: 1rem;">🎥 No videos available</h2>
                        <p style="font-size: 1.2rem;">Videos will appear here when available...</p>
                    </div>
                `;
                return;
            }

            videoContainer.innerHTML = '';

            videos.forEach((video, index) => {
                // Skip empty URLs
                if (!video || !video.url || video.url.trim() === '') {
                    return;
                }

                const videoItem = document.createElement('div');
                videoItem.className = 'video-item';
                
                // Create video element with autoplay in thumbnail mode
                videoItem.innerHTML = `
                    <div class="video-wrapper">
                        <video 
                            src="${escapeHtml(video.url)}" 
                            autoplay 
                            muted 
                            loop
                            playsinline
                            preload="auto"
                        ></video>
                        <div class="video-loading">Loading video...</div>
                    </div>
                    <div class="video-name">${escapeHtml(video.nome)}</div>
                `;

                // Add click handler to open video modal
                videoItem.addEventListener('click', () => {
                    openVideoModal(video.url, video.nome);
                });

                videoContainer.appendChild(videoItem);

                // Handle video load
                const videoElement = videoItem.querySelector('video');
                const loadingDiv = videoItem.querySelector('.video-loading');
                
                if (videoElement) {
                    videoElement.addEventListener('loadeddata', () => {
                        // Video loaded successfully
                        if (loadingDiv) {
                            loadingDiv.style.display = 'none';
                        }
                    });

                    videoElement.addEventListener('canplay', () => {
                        // Video can start playing
                        if (loadingDiv) {
                            loadingDiv.style.display = 'none';
                        }
                    });

                    videoElement.addEventListener('error', (e) => {
                        // Handle video load error
                        console.error('Video load error:', video.url, e);
                        if (loadingDiv) {
                            loadingDiv.textContent = '❌ Video not available';
                            loadingDiv.style.display = 'block';
                        }
                        // Hide video on error
                        videoElement.style.display = 'none';
                    });
                }
            });
        }

        // Video Modal Functions
        function openVideoModal(videoUrl, videoName) {
            const modalOverlay = document.getElementById('video-modal-overlay');
            const modalPlayer = document.getElementById('video-modal-player');
            const modalName = document.getElementById('video-modal-name');
            
            if (modalOverlay && modalPlayer && modalName) {
                modalName.textContent = videoName;
                modalPlayer.src = videoUrl;
                modalPlayer.muted = false; // Enable audio
                modalOverlay.style.display = 'flex';
                
                // Play video when modal opens
                modalPlayer.play().catch(err => {
                    console.error('Error playing video:', err);
                });
            }
        }

        function closeVideoModal() {
            const modalOverlay = document.getElementById('video-modal-overlay');
            const modalPlayer = document.getElementById('video-modal-player');
            
            if (modalOverlay && modalPlayer) {
                modalPlayer.pause();
                modalPlayer.src = '';
                modalOverlay.style.display = 'none';
            }
        }

        // Video modal event listeners
        const videoModalClose = document.getElementById('video-modal-close');
        const videoModalOverlay = document.getElementById('video-modal-overlay');
        
        if (videoModalClose) {
            videoModalClose.addEventListener('click', closeVideoModal);
        }
        
        if (videoModalOverlay) {
            // Close modal when clicking on overlay (but not on the content)
            videoModalOverlay.addEventListener('click', (e) => {
                if (e.target === videoModalOverlay) {
                    closeVideoModal();
                }
            });
            
            // Close modal with Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && videoModalOverlay.style.display === 'flex') {
                    closeVideoModal();
                }
            });
        }

        // Draw button click handler
        document.getElementById('draw-button').addEventListener('click', performDraw);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
            if (rotationInterval) {
                clearInterval(rotationInterval);
            }
            if (videoRotationInterval) {
                clearInterval(videoRotationInterval);
            }
            window.removeEventListener('resize', handleResize);
        });
    </script>
</body>
</html>
