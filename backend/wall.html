<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Santa - Badge Wall</title>
    <link rel="icon" type="image/svg+xml" href="/wall-favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, hsl(0 0% 98%), hsl(142 20% 98%));
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Snowflakes animation */
        .snowflakes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .snowflake {
            position: absolute;
            color: hsl(0 84% 50% / 0.2);
            font-size: 1.5em;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        /* Header */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: hsl(0 84% 50%);
            color: white;
            padding: 1.5rem;
            text-align: center;
            z-index: 10;
            border-bottom: 4px solid hsl(142 76% 20%);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Badge wall container */
        .wall-container {
            position: absolute;
            top: 100px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            padding: 2rem;
        }

        .badge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            animation: scroll 60s linear infinite;
            width: max-content;
        }

        @keyframes scroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        .badge-card {
            background: white;
            border: 4px solid hsl(142 76% 20%);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 6px 6px 0px hsl(142 76% 20%);
            transition: transform 0.3s ease;
            width: 300px;
            height: 400px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .badge-card:hover {
            transform: scale(1.05);
            box-shadow: 8px 8px 0px hsl(142 76% 20%);
        }

        .badge-image-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: hsl(142 20% 95%);
            border-radius: 0.5rem;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .badge-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .badge-info {
            text-align: center;
        }

        .badge-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: hsl(142 76% 20%);
            margin-bottom: 0.5rem;
        }

        .badge-category {
            font-size: 0.875rem;
            color: hsl(142 30% 40%);
            text-transform: capitalize;
        }

        /* Empty state */
        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: hsl(142 30% 40%);
        }

        .empty-state h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        /* Loading state */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: hsl(142 30% 40%);
        }

        .spinner {
            border: 4px solid hsl(142 20% 95%);
            border-top: 4px solid hsl(0 84% 50%);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Duplicate badges for seamless loop */
        .badge-grid.duplicate {
            animation: scroll-duplicate 60s linear infinite;
        }

        @keyframes scroll-duplicate {
            0% {
                transform: translateX(-50%);
            }
            100% {
                transform: translateX(-100%);
            }
        }
    </style>
</head>
<body>
    <!-- Snowflakes -->
    <div class="snowflakes" id="snowflakes"></div>

    <!-- Header -->
    <div class="header">
        <h1>🎄 Secret Santa Badge Wall 🎄</h1>
    </div>

    <!-- Wall Container -->
    <div class="wall-container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading badges...</p>
        </div>
        <div id="empty-state" class="empty-state" style="display: none;">
            <h2>🎁 No badges yet!</h2>
            <p>Badges will appear here as they are created...</p>
        </div>
        <div id="badge-container" style="display: none;"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/get-badges';
        let currentBadges = [];
        let refreshInterval;

        // Create snowflakes
        function createSnowflakes() {
            const snowflakesContainer = document.getElementById('snowflakes');
            const snowflakeCount = 30;
            
            for (let i = 0; i < snowflakeCount; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.innerHTML = '❄️';
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.animationDuration = (Math.random() * 3 + 2) + 's';
                snowflake.style.animationDelay = Math.random() * 2 + 's';
                snowflake.style.opacity = Math.random() * 0.5 + 0.3;
                snowflakesContainer.appendChild(snowflake);
            }
        }

        // Fetch badges from API
        async function fetchBadges() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error('Failed to fetch badges');
                }
                const badges = await response.json();
                return badges;
            } catch (error) {
                console.error('Error fetching badges:', error);
                return [];
            }
        }

        // Render badges
        function renderBadges(badges) {
            const container = document.getElementById('badge-container');
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('empty-state');

            if (badges.length === 0) {
                loading.style.display = 'none';
                container.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            loading.style.display = 'none';
            emptyState.style.display = 'none';
            container.style.display = 'block';

            // Check if badges have changed
            const badgesChanged = JSON.stringify(badges) !== JSON.stringify(currentBadges);
            if (!badgesChanged && container.innerHTML) {
                return; // No need to re-render
            }

            currentBadges = badges;

            // Create grid with duplicates for seamless scrolling
            const grid = document.createElement('div');
            grid.className = 'badge-grid';
            grid.id = 'badge-grid';

            // Render badges twice for seamless loop
            for (let i = 0; i < 2; i++) {
                badges.forEach(badge => {
                    const card = document.createElement('div');
                    card.className = 'badge-card';
                    
                    card.innerHTML = `
                        <div class="badge-image-container">
                            <img src="${badge.imageUrl}" alt="${badge.name}" class="badge-image" onerror="this.style.display='none'">
                        </div>
                        <div class="badge-info">
                            <div class="badge-name">${escapeHtml(badge.name)}</div>
                            <div class="badge-category">${escapeHtml(badge.category)}</div>
                        </div>
                    `;
                    
                    grid.appendChild(card);
                });
            }

            container.innerHTML = '';
            container.appendChild(grid);
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Update badges
        async function updateBadges() {
            const badges = await fetchBadges();
            renderBadges(badges);
        }

        // Initialize
        async function init() {
            createSnowflakes();
            await updateBadges();
            
            // Auto-refresh every 5 seconds
            refreshInterval = setInterval(updateBadges, 5000);
        }

        // Start when page loads
        window.addEventListener('load', init);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
